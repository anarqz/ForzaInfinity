# Builds landing/ and publishes it to GitHub Pages (Settings > Pages > Source: GitHub Actions).
name: landing

on:
  push:
    branches: [landing]
    paths: ["landing/**", ".github/workflows/landing.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: landing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: landing/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
          VITE_REPO: ${{ github.repository }}
          VITE_STATS_URL: ${{ vars.STATS_URL }}
          VITE_SERVER_ADDRESS: ${{ vars.SERVER_ADDRESS }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: landing/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
