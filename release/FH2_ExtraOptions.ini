; Forza Horizon 2 Extra Options
; Release v0.2.34
; by Arthur (RokkuDayo)

; Settings are only read at game startup.
; Place this file beside azimuth-tls.dll in Azimuth/data/bin, or xg.dll in Mount for Mezcal.
; 0 = off, 1 = on.

[Global]
Enabled=1

[Content]
; Grants entitlements for all DLC content.
; Treasure Map and VIP DLCs have their own toggles below.
; The Storm Island map will not be accessible if you don't have the DLC package mounted, but it's vehicles will be available regardless.
UnlockDLC=1

; Grants entitlement for VIP status and its perks.
; Double credits and XP rewards, and double bonus on wheelspins.
OfflineVIP=1

; Bypasses Storm Island event requirements for purchasing the Ranger T6 and #7 SST.
UnlockStormIslandCars=1

; Reveals all bonus boards and barn locations on the mainland and Storm Island.
; Also enables the local Treasure Map listing in the Extras menu of the Marketplace tab while offline.
; Important: Enabling this, entering the game, saving, disabling this, and then entering the game again will keep all boards discovered.
UnlockTreasureMap=0

[Frontend]
; Boots straight into the "Press Start" menu.
SkipIntro=1

; Enables the Marketplace menu without an XBOX Live connection.
EnableMarketplace=1

; Enables the "Get In Car" feature during free-roam.
; You can find it by selecting any car in the "My Cars" section of the pause menu.
GetInCarFromPauseMenu=1

; Places the new car at the nearest valid road after changing cars.
; Requires "GetInCarFromPauseMenu" to be enabled.
; Setting this to off will keep the new car exactly where the previous one was.
SnapToRoadOnCarChange=1

[Livery]
; Changes the rendering resolution for the player's livery from 1024x1024 to 4096x4096.
Enable4K=1

; Sets the multisampling mode for the player's livery.
; 2 = Vanilla intermediate 2x MSAA; 4 = Enhanced intermediate 4x MSAA.
IntermediateMSAA=4

; Enables 2x supersampling per livery region to the intermediate render.
; Final liveries remain rendered at 4096x4096. 
; This adds a slight extra cost to memory usage for little improvement to the aliasing on the texture.
ExtraSupersampling=0

[Graphics]
; Updates the sun position and its shadow maps on every frame.
; Increases GPU load.
SmoothSunShadows=0

[Language]
; Sets the text and audio languagues independently.
; Auto will use the system's locale.
; Text: Auto, EN, GB, DE, FR, IT, ES, MX, JP, KO, CHT, BR, CZ, HU, NL, PL, RU
; Audio: Auto, EN, DE, FR, IT, ES, MX, JP, BR, PL, RU
Text=Auto
Audio=Auto

[Compatibility]
; Allow user-created content privilege checks locally.
; This has no effect on Mezcal.
DisableParentalLocks=1

; Skips Azimuth 0.9.6/0.9.7's save data blob hash and file size comparisons.
; Marker format and normal writes remain.
; This has no effect on Mezcal.
DisableAzimuthSaveChecksums=0

[Profile]
; Uses Gamerpic.png beside this INI as the local player's gamerpic.
; Square PNG recommended. Maximum supported dimensions are 2048x2048 and a maximum file size of 16 MB.
CustomGamerpic=1

[PhotoMode]
; Removes the camera collision detection and boundaries in photo mode.
FreeCamera=1

[Autodrive]
; Allows you to set a GPS route in free roam and then press F2 or D-pad Down to have the game drive you there.
; Pressing F2/Down again, steering, accelerating, braking, pausing or arriving restores player control.
Enabled=1

; Enables a cinematic camera during Autodrive by using the cameras from replay mode.
; Kicks in after 3 seconds.
Cinematic=1
InEvents=1

[Network]
; ForzaInfinity: intercepta as requisicoes HTTP do jogo (IXMLHTTPRequest2) dentro do Azimuth 0.9.7.
; Off     = comportamento original do Azimuth (offline).
; Capture = registra cada requisicao em FH2_Network.jsonl e responde "offline" como o Azimuth.
; Proxy   = encaminha para o servidor de testes e entrega a resposta dele ao jogo.
Mode=Proxy

; Endereco do fh2-server (host:porta). Pode ser outra maquina da rede.
Server=__SERVER__
